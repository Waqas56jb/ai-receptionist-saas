<!doctype html>
<html lang="en" data-site-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0066FF" />

    <title>Admin Control Center | DEVMARK SOLUTION</title>
    <meta name="description" content="Private administration console for the AI receptionist platform." />
    <!-- Private console: keep it out of search results entirely. -->
    <meta name="robots" content="noindex, nofollow" />

    <link rel="icon" type="image/png" sizes="512x512" href="/logo-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var theme = 'dark'
        var lang = 'en'
        try {
          var stored = window.localStorage.getItem('site-theme')
          if (stored === 'light' || stored === 'dark') theme = stored
          var storedLang = window.localStorage.getItem('devmark.ui.language')
          if (storedLang === 'en' || storedLang === 'fr' || storedLang === 'ar' || storedLang === 'so') lang = storedLang
        } catch (e) {}
        document.documentElement.setAttribute('data-site-theme', theme)
        document.documentElement.lang = lang
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr'
        document.documentElement.setAttribute('data-lang', lang)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
